study_id: lvef-dev15
site_config: ${MIVAL_HOME}/config/site.yaml  # 기관 설정 (site, DB, schema, DICOM 경로). README 4.2
seed: 20260921

stages:
  retrieve:
    # 층화 분석용 ECG 정보 (MI-CDM에서 읽음). 기준값은 MIMIC에서 한 번 구해 고정한 값이며
    # 기관 데이터로 다시 계산하지 않는다. 그래야 모든 기관에서 low/high의 뜻이 같다.
    ecg_context:
      visit_type: true  # image_occurrence.visit_occurrence_id -> visit_occurrence.visit_concept_id 이름. 연결 없음 = unlinked
      acquisition:
        # Filter Low Frequency (Hz), image_feature -> measurement. MIMIC-IV-ECG 전체 796,617건의 median 0.005
        # (0.0005: 110,365 / 0.005: 634,946 / 0.05: 51,306). low = 0.005 이하, high = 0.005 초과, 값 없음 = unknown
        - {name: filter_low_hz, concept_id: 2128002424, split_at: 0.005}
    label_concept_id: 3027172
    window_days: 7
    window_days_sens2: 30
    implausible_below: null  # LVEF 값으로 제외하지 않음 (null = 하한 없음)
    primary_cutoff: 40
    sens1_cutoff: 50
    require_local_file: true
    ecg_selection: {per_person: all}

  profile:
    # 설계 (2): 환자 단위 단순 랜덤 분할(층화 없음). dev 15% / validation 85%.
    # dev 15%로 재보정과 threshold(Youden, rule-out sens 95%, rule-in spec 95%)를 정하고,
    # linear probe arm은 dev 15% 안에서 5-fold로 학습한다. 결과는 validation 85%에서 낸다.
    test_fraction: 0.85
    n_folds: 5
    stratify_on: none
    min_test_positives: 0  # event 수로 실행을 멈추지 않음

  preprocess:
    loader: dicom
    registry: registry/models
    allow_upsample: false
    pad_policy: reject
    # perturbation.axes is study-wide: one grid degrades every card in
    # `registry` (see check_grid_against_contract in perturbation.py), but
    # this study's four cards run at 500, 250 and 100 Hz, all at 10 s. No
    # single set of degrading resample/duration levels stays below every
    # card's own contract rate/duration, so a baseline-only level is used for
    # both axes instead: the checker treats a level equal to the axis's own
    # baseline as the identity (it only warns when the baseline is set above
    # a card's contract, never when it matches). lead_dropout and
    # amplitude_scale are unaffected by rate/duration and keep their
    # framework defaults.
    perturbation:
      axes:
        resample: [500]
        duration: [10]

  describe:
    age_bands: [50, 65, 80]
    conditions: []  # v1은 동반질환을 읽지 않는다 (논문 한계)
    outcome: label_primary

  models:
    registry: registry/models
    batch_size: 64
    arms:
      - {model_id: heartwise-lvef-binary, training_mode: inference_only, label_def: primary}
      - {model_id: heartwise-lvef-regression, training_mode: inference_only, label_def: value}
      - {model_id: ecgfounder, training_mode: linear_probe, label_def: primary, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: ecgfounder, training_mode: linear_probe, label_def: value, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: xecg, training_mode: linear_probe, label_def: primary, hparam_grid: {lr: [0.01, 0.001]}}
      - {model_id: xecg, training_mode: linear_probe, label_def: value, hparam_grid: {lr: [0.01, 0.001]}}

  evaluate:
    outcomes: {primary: null}
    regression_cuts: [{value: 40, op: "<="}]
    bootstrap_replicates: 2000
    figures: true
    subgroups: [sex, age_band, device_manufacturer, visit_type, acq_filter_low_hz]
    net_benefit_grid: {start: 0.01, stop: 0.99, step: 0.01}
    min_events: 10

  export:
    min_cell: 1  # 소수 집계를 가리지 않음 (count를 masked로 바꾸지 않고 그대로 낸다)
    prespecified_subgroups: [sex, age_band]  # 사전 지정 하위군(spec 1.3). 나머지 subgroups(device_manufacturer, visit_type, acq_filter_low_hz)는 탐색적
