study_id: ecg-age
site_config: ${MIVAL_HOME}/config/site.yaml  # 기관 설정 (site, DB, schema, DICOM 경로). README 4.2
seed: 20261007

stages:
  retrieve:
    require_local_file: true
    ecg_selection: {per_person: one, rule: random}
    label_source: {kind: age_at_ecg}

  profile:
    test_fraction: 0.2
    n_folds: 5
    stratify_on: none
    min_test_positives: 0

  preprocess:
    loader: dicom
    allow_upsample: false
    perturbation:
      axes:
        resample: [500]
        duration: [10.24]  # baseline-only; Lima's contract is 10 s padded to 4096 at 400 Hz (Singstad's 10 s is below it)
    registry: registry/age
    pad_policy: zero  # Lima centres 10 s in 4096 samples at 400 Hz (pad_anchor: center)

  models:
    registry: registry/age
    batch_size: 64
    arms:
      - {model_id: lima-ecg-age, training_mode: inference_only, label_def: value}
      - {model_id: singstad-ecg-age, training_mode: inference_only, label_def: value}

  evaluate:
    outcomes: {age: null}
    regression_cuts: {value: [65]}
    bootstrap_replicates: 2000
    figures: true
