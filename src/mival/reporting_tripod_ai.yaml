# TRIPOD+AI checklist (Collins et al., BMJ 2024), one entry per item.
#
# `files` are glob patterns over the export bundle's paths. An item is `auto`
# when the bundle holds a file matching one of them, `manual` otherwise.
# Patterns follow the design spec's guideline table (section 4); an item that
# table does not name has no pattern and is always written by hand. 20c and
# 23b are filled by the lab's pooling tool, not by a site bundle, so they have
# no bundle pattern either.
